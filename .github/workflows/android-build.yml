Name: VirtualDroid Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Setup Gradle secara otomatis (cache, dll)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Wajib agar script gradlew bisa dijalankan di server ubuntu
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Gunakan ./gradlew (Wrapper) alih-alih gradle global
      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VirtualDroid-debug-apk
          # Pastikan path ini sesuai dengan struktur folder projectmu
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
