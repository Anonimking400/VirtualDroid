name: Build QEMU for Android ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_NDK_VERSION: 27.2.12479018

    steps:
      - name: Checkout QEMU source
        uses: actions/checkout@v4
        with:
          repository: qemu/qemu
          ref: v9.2.4
          path: qemu-source
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          set -eux
          sdkmanager "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            python3-venv \
            libglib2.0-dev \
            libpixman-1-dev \
            zlib1g-dev \
            libslirp-dev \
            xz-utils

      - name: Inspect Android NDK
        run: |
          set -eux
          test -d "$ANDROID_NDK_HOME"
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android27-clang"
          echo "Android NDK found at $ANDROID_NDK_HOME"

      - name: Test Android ARM64 compiler
        run: |
          set -eux

          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          printf 'int main(void) { return 0; }\n' > hello.c

          "$TOOLCHAIN/bin/aarch64-linux-android27-clang" \
            hello.c -o hello-android

          file hello-android
          "$TOOLCHAIN/bin/llvm-readelf" -h hello-android
          "$TOOLCHAIN/bin/llvm-readelf" -l hello-android

      - name: Inspect QEMU dependencies
        run: |
          set -eux
          cd qemu-source

          echo "=== Git submodules ==="
          git submodule status || true

          echo "=== Meson wrap files ==="
          find subprojects -maxdepth 2 -name '*.wrap' -print || true

          echo "=== GLib and Pixman references ==="
          grep -n -i -E 'glib|pixman' meson.build || true

      - name: Check host dependency versions
        run: |
          set -eux
          pkg-config --modversion glib-2.0
          pkg-config --modversion pixman-1
          pkg-config --variable=libdir glib-2.0
          pkg-config --variable=libdir pixman-1

      - name: Test Android dependency build tools
        run: |
          set -eux

          python3 --version
          ninja --version
          git --version

          python3 -m pip install --user --upgrade 'meson>=1.3.0,<2'

          MESON="$(python3 -m site --user-base)/bin/meson"
          echo "Meson path: $MESON"
          test -x "$MESON"
          "$MESON" --version

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android27-clang" --version

      - name: Check GLib source archive
        run: |
          set -eux

          python3 - <<'PY'
          import urllib.request

          url = "https://download.gnome.org/sources/glib/2.82/glib-2.82.4.tar.xz"
          request = urllib.request.Request(url, method="HEAD")

          with urllib.request.urlopen(request, timeout=30) as response:
              print("HTTP status:", response.status)
              print("Content length:", response.headers.get("Content-Length"))
              if response.status != 200:
                  raise SystemExit("GLib source archive check failed")
          PY

      - name: Download and inspect GLib source
        run: |
          set -eux

          mkdir -p "$RUNNER_TEMP/glib-source"
          cd "$RUNNER_TEMP/glib-source"

          python3 -c "import urllib.request; urllib.request.urlretrieve('https://download.gnome.org/sources/glib/2.82/glib-2.82.4.tar.xz', 'glib.tar.xz')"

          tar -tf glib.tar.xz > archive-files.txt
          sed -n '1,20p' archive-files.txt

          tar -xf glib.tar.xz
          test -f glib-2.82.4/meson.build

          echo "GLib source archive verified"

      - name: Inspect GLib Android cross file
        run: |
          set -eux

          GLIB="$RUNNER_TEMP/glib-source/glib-2.82.4"

          test -f "$GLIB/.gitlab-ci/cross_file_android_arm64_31.txt"
          test -f "$GLIB/.gitlab-ci/android-ndk.sh"

          echo "=== GLib Android cross file ==="
          sed -n '1,220p' "$GLIB/.gitlab-ci/cross_file_android_arm64_31.txt"

          echo "=== GLib Android build instructions ==="
          grep -n -i -E 'android|libffi|pcre2|cross.file|meson setup' \
            "$GLIB/.gitlab-ci/android-ndk.sh" || true

      - name: Check Android NDK toolchain paths
        run: |
          set -eux

          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          SYSROOT="$TOOLCHAIN/sysroot"

          test -x "$TOOLCHAIN/bin/aarch64-linux-android27-clang"
          test -x "$TOOLCHAIN/bin/aarch64-linux-android27-clang++"
          test -x "$TOOLCHAIN/bin/llvm-ar"
          test -x "$TOOLCHAIN/bin/llvm-strip"
          test -d "$SYSROOT"
          test -d "$SYSROOT/usr/include"

          echo "=== Android compiler ==="
          "$TOOLCHAIN/bin/aarch64-linux-android27-clang" --version

          echo "=== Android sysroot ==="
          echo "$SYSROOT"

          echo "Android NDK toolchain checks passed"

      - name: Inspect GLib build dependencies
        run: |
          set -eux

          GLIB="$RUNNER_TEMP/glib-source/glib-2.82.4"

          echo "=== GLib subproject files ==="
          find "$GLIB/subprojects" -maxdepth 2 -type f -print || true

          echo "=== GLib dependency declarations ==="
          grep -n -i -E \
            "dependency\\('libffi|dependency\\('libpcre2|dependency\\('zlib|allow_fallback|default_library" \
            "$GLIB/meson.build" || true

          echo "=== Official Android build script ==="
          sed -n '1,240p' "$GLIB/.gitlab-ci/android-ndk.sh"

          echo "=== Dependency inspection completed ==="

      - name: Inspect GLib dependency wrap files
        run: |
          set -eux

          GLIB="$RUNNER_TEMP/glib-source/glib-2.82.4"

          for dep in libffi zlib pcre2; do
            echo "=== ${dep}.wrap ==="
            sed -n '1,160p' "$GLIB/subprojects/${dep}.wrap"
          done

          echo "=== Dependency wrap inspection completed ==="
