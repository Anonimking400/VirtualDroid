name: Build QEMU for Android ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build QEMU Android ARM64
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      ANDROID_NDK_VERSION: 27.2.12479018
      API_LEVEL: "27"
      GLIB_VERSION: 2.82.4
      PIXMAN_VERSION: 0.44.2
      QEMU_VERSION: v9.2.4
      PREFIX: /home/runner/android-arm64-prefix

    steps:
      - name: Checkout QEMU source
        uses: actions/checkout@v4
        with:
          repository: qemu/qemu
          ref: v9.2.4
          path: qemu-source
          fetch-depth: 1

      - name: Install host build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            python3-venv \
            git \
            curl \
            wget \
            ca-certificates \
            xz-utils \
            unzip \
            zip \
            tar \
            bison \
            flex \
            gettext \
            libglib2.0-dev \
            libpixman-1-dev \
            zlib1g-dev \
            libslirp-dev

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: ndk;27.2.12479018

      - name: Configure Android toolchain
        run: |
          set -eux

          NDK="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          test -x "$TOOLCHAIN/bin/aarch64-linux-android${API_LEVEL}-clang"
          test -x "$TOOLCHAIN/bin/aarch64-linux-android${API_LEVEL}-clang++"

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "CC=$TOOLCHAIN/bin/aarch64-linux-android${API_LEVEL}-clang" >> "$GITHUB_ENV"
          echo "CXX=$TOOLCHAIN/bin/aarch64-linux-android${API_LEVEL}-clang++" >> "$GITHUB_ENV"
          echo "AR=$TOOLCHAIN/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "STRIP=$TOOLCHAIN/bin/llvm-strip" >> "$GITHUB_ENV"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          "$TOOLCHAIN/bin/aarch64-linux-android${API_LEVEL}-clang" --version

      - name: Install Meson
        run: |
          set -eux
          python3 -m pip install --user --upgrade "meson>=1.3.0,<2"
          "$HOME/.local/bin/meson" --version

      - name: Create Android cross compilation file
        run: |
          set -eux

          SYSROOT="$ANDROID_TOOLCHAIN/sysroot"
          CROSS_FILE="$RUNNER_TEMP/android-arm64-api27.ini"

          cat > "$CROSS_FILE" <<EOF
          [binaries]
          c = '$CC'
          cpp = '$CXX'
          ar = '$AR'
          strip = '$STRIP'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'

          [properties]
          sys_root = '$SYSROOT'
          needs_exe_wrapper = true

          [built-in options]
          c_args = ['-fPIC']
          cpp_args = ['-fPIC']
          EOF

          echo "CROSS_FILE=$CROSS_FILE" >> "$GITHUB_ENV"
          cat "$CROSS_FILE"

      - name: Test Android compiler
        run: |
          set -eux

          cat > "$RUNNER_TEMP/test.c" <<'EOF'
          #include <stdio.h>
          int main(void) {
            puts("Android ARM64 compiler works");
            return 0;
          }
          EOF

          "$CC" "$RUNNER_TEMP/test.c" \
            -o "$RUNNER_TEMP/test-android"

          file "$RUNNER_TEMP/test-android"

      - name: Download GLib source
        run: |
          set -eux

          mkdir -p "$RUNNER_TEMP/glib-source"

          curl -fL --retry 3 \
            "https://download.gnome.org/sources/glib/2.82/glib-${GLIB_VERSION}.tar.xz" \
            -o "$RUNNER_TEMP/glib.tar.xz"

          tar -xf "$RUNNER_TEMP/glib.tar.xz" \
            -C "$RUNNER_TEMP/glib-source"

          test -f "$RUNNER_TEMP/glib-source/glib-${GLIB_VERSION}/meson.build"

      - name: Build and install GNU libiconv
        run: |
          set -eux
          
          curl -fL --retry 3 "https://ftp.gnu.org/pub/gnu/libiconv/libiconv-1.17.tar.gz" -o "$RUNNER_TEMP/libiconv.tar.gz"
          mkdir -p "$RUNNER_TEMP/libiconv-source"
          tar -xf "$RUNNER_TEMP/libiconv.tar.gz" -C "$RUNNER_TEMP/libiconv-source" --strip-components=1
          
          cd "$RUNNER_TEMP/libiconv-source"
          ./configure \
            --host=aarch64-linux-android \
            --prefix="$PREFIX" \
            CC="$CC" \
            AR="$AR" \
            RANLIB="$ANDROID_TOOLCHAIN/bin/llvm-ranlib" \
            STRIP="$STRIP"
          
          make -j2
          make install

      - name: Configure GLib for Android ARM64
        run: |
          set -eux

          GLIB="$RUNNER_TEMP/glib-source/glib-${GLIB_VERSION}"
          BUILD="$RUNNER_TEMP/glib-build"

          export CFLAGS="-I$PREFIX/include"
          export LDFLAGS="-L$PREFIX/lib"

          "$HOME/.local/bin/meson" setup "$BUILD" "$GLIB" \
            --cross-file "$CROSS_FILE" \
            --prefix="$PREFIX" \
            --libdir=lib \
            --buildtype=release \
            --wrap-mode=forcefallback \
            -Diconv=external \
            -Dc_args="$CFLAGS" \
            -Dc_link_args="$LDFLAGS" \
            -Dtests=false \
            -Dintrospection=disabled \
            -Ddocumentation=false \
            -Dman-pages=disabled \
            -Dselinux=disabled \
            -Dlibmount=disabled

      - name: Build and install GLib
        run: |
          set -eux

          "$HOME/.local/bin/meson" compile \
            -C "$RUNNER_TEMP/glib-build" \
            -j 2

          "$HOME/.local/bin/meson" install \
            -C "$RUNNER_TEMP/glib-build"

          test -d "$PREFIX/include/glib-2.0"
          find "$PREFIX" -maxdepth 3 -type f | head -100

      - name: Configure target pkg-config paths
        run: |
          set -eux

          echo "PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig:$PREFIX/share/pkgconfig" \
            >> "$GITHUB_ENV"

          echo "PKG_CONFIG_LIBDIR=$PREFIX/lib/pkgconfig:$PREFIX/share/pkgconfig" \
            >> "$GITHUB_ENV"

          echo "CFLAGS=-I$PREFIX/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$PREFIX/lib" >> "$GITHUB_ENV"

      - name: Download Pixman source
        run: |
          set -eux

          mkdir -p "$RUNNER_TEMP/pixman-source"

          curl -fL --retry 3 \
            "https://cairographics.org/releases/pixman-${PIXMAN_VERSION}.tar.gz" \
            -o "$RUNNER_TEMP/pixman.tar.gz"

          tar -xf "$RUNNER_TEMP/pixman.tar.gz" \
            -C "$RUNNER_TEMP/pixman-source"

          test -f "$RUNNER_TEMP/pixman-source/pixman-${PIXMAN_VERSION}/meson.build"

      - name: Configure Pixman for Android ARM64
        run: |
          set -eux

          PIXMAN="$RUNNER_TEMP/pixman-source/pixman-${PIXMAN_VERSION}"

          "$HOME/.local/bin/meson" setup \
            "$RUNNER_TEMP/pixman-build" "$PIXMAN" \
            --cross-file "$CROSS_FILE" \
            --prefix="$PREFIX" \
            --libdir=lib \
            --buildtype=release \
            -Ddefault_library=shared \
            -Dtests=disabled

      - name: Build and install Pixman
        run: |
          set -eux

          "$HOME/.local/bin/meson" compile \
            -C "$RUNNER_TEMP/pixman-build" \
            -j 2

          "$HOME/.local/bin/meson" install \
            -C "$RUNNER_TEMP/pixman-build"

          find "$PREFIX" -iname '*pixman*'

      - name: Configure QEMU for Android ARM64
        run: |
          set -eux

          cd qemu-source
          mkdir -p "$RUNNER_TEMP/qemu-build"
          cd "$RUNNER_TEMP/qemu-build"

          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$PREFIX/share/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig:$PREFIX/share/pkgconfig"
          export CFLAGS="-I$PREFIX/include"
          export LDFLAGS="-L$PREFIX/lib"

          "$GITHUB_WORKSPACE/qemu-source/configure" \
            --prefix="$PREFIX" \
            --target-list=aarch64-softmmu \
            --cross-cc-aarch64="$CC" \
            --cc="$CC" \
            --host-cc=gcc \
            --enable-tcg \
            --disable-kvm \
            --disable-werror \
            --disable-docs \
            --disable-tools \
            --disable-guest-agent \
            --disable-slirp \
            --disable-capstone \
            --disable-curl \
            --disable-gtk \
            --disable-sdl \
            --disable-opengl \
            --disable-vnc \
            --disable-alsa \
            --disable-pa \
            --disable-pipewire \
            --disable-usb-redir \
            --disable-vde \
            --disable-xen \
            --disable-seccomp \
            --disable-virtfs \
            --disable-linux-aio \
            --disable-libnfs \
            --disable-rbd \
            --disable-glusterfs \
            --disable-libiscsi \
            --disable-smartcard \
            --disable-lzo \
            --disable-snappy \
            --disable-zstd \
            --disable-numa \
            --disable-plugins

      - name: Build QEMU
        run: |
          set -eux

          cmake_status=0
          ninja -C "$RUNNER_TEMP/qemu-build" -j 2 || cmake_status=$?

          if [ "$cmake_status" -ne 0 ]; then
            echo "QEMU compilation failed; inspect the error above."
            exit "$cmake_status"
          fi

      - name: Package build output
        run: |
          set -eux

          mkdir -p "$RUNNER_TEMP/qemu-package"

          find "$RUNNER_TEMP/qemu-build" \
            -type f -name 'qemu-system-aarch64' \
            -exec cp {} "$RUNNER_TEMP/qemu-package/" \;

          if [ ! -f "$RUNNER_TEMP/qemu-package/qemu-system-aarch64" ]; then
            echo "ERROR: QEMU binary was not produced."
            find "$RUNNER_TEMP/qemu-build" -maxdepth 3 -type f | head -200
            exit 1
          fi

          cp -a "$PREFIX"/. "$RUNNER_TEMP/qemu-package/" || true

          tar -czf "$RUNNER_TEMP/qemu-android-arm64.tar.gz" \
            -C "$RUNNER_TEMP/qemu-package" .

          ls -lh "$RUNNER_TEMP/qemu-android-arm64.tar.gz"

      - name: Upload QEMU Android ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: qemu-android-arm64
          path: ${{ runner.temp }}/qemu-android-arm64.tar.gz
          if-no-files-found: error
          retention-days: 7
