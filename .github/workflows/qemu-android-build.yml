name: VirtualDroid QEMU Android ARM64

on:
  workflow_dispatch:

env:
  ANDROID_NDK_VERSION: 27.2.12479018

jobs:
  build-qemu-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout QEMU
        uses: actions/checkout@v4
        with:
          repository: qemu/qemu
          ref: v9.2.4
          path: qemu-source
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          set -eux
          sdkmanager "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            meson \
            pkg-config \
            python3 \
            python3-pip \
            python3-venv \
            libglib2.0-dev \
            libpixman-1-dev \
            zlib1g-dev \
            libslirp-dev

      - name: Inspect Android NDK
        run: |
          set -eux
          test -d "$ANDROID_NDK_HOME"
          ls "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

      - name: Test Android ARM64 compiler
        run: |
          set -eux

          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC="$TOOLCHAIN/aarch64-linux-android27-clang"

          cat > hello.c <<'EOF'
          #include <stdio.h>

          int main(void) {
              puts("VirtualDroid Android ARM64 toolchain OK");
              return 0;
          }
          EOF

          "$CC" hello.c -o hello-android

          file hello-android

          "$TOOLCHAIN/llvm-readelf" -h hello-android

      - name: Inspect QEMU dependencies
        run: |
          set -eux

          cd qemu-source

          echo "=== Git submodules ==="
          git submodule status

          echo "=== Meson dependency files ==="
          find subprojects -maxdepth 2 -name '*.wrap' -print 2>/dev/null || true

          echo "=== GLib and Pixman references ==="
          grep -n -i -E 'glib|pixman' meson.build

      - name: Check host dependency versions
        run: |
          set -eux

          pkg-config --modversion glib-2.0
          pkg-config --modversion pixman-1

          pkg-config --variable=libdir glib-2.0
          pkg-config --variable=libdir pixman-1

        
      - name: Check GLib source archive
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/glib-check"
          cd "$RUNNER_TEMP/glib-check"
          python3 -c "import urllib.request; u='https://download.gnome.org/sources/glib/2.82/glib-2.82.4.tar.xz'; r=urllib.request.urlopen(u, timeout=30); print('HTTP status:', r.status); print('Content length:', r.headers.get('Content-Length'))"
  

      - name: Test Android dependency build tools
        run: |
          set -eux

          python3 --version
          ninja --version
          git --version

          python3 -m pip install --user --upgrade 'meson>=1.3.0,<2'

          MESON="$(python3 -m site --user-base)/bin/meson"

          echo "Meson path: $MESON"

          test -x "$MESON"

          "$MESON" --version

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android27-clang" --version
